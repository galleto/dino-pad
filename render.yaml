# Render Blueprint: backend FastAPI de DINO PAD (plan gratis).
# Render > New > Blueprint > este repo y rama. Los valores con "sync: false" los pide al crear
# el servicio (no se guardan en el repo).
# Plan gratis: se duerme tras 15 min sin peticiones HTTP y tarda ~1 min en despertar. Mientras
# el DINO PAD está mandando datos (cada pocos segundos) no se duerme.
services:
  - type: web
    name: dinopad-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Solo redesplegar si cambia el backend o este archivo (no por cambios del firmware o la web):
    # cada redespliegue deja ~3 min sin servicio.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_ENV
        value: production
      # El DINO PAD manda sus datos por HTTPS a /api/device/ingest con esta clave (Render la
      # genera; cópiala de Environment al secretos.h del firmware). No hace falta broker MQTT.
      - key: DEVICE_TOKEN
        generateValue: true
      - key: CORS_ORIGINS         # la página publicada (y el dominio propio, cuando exista)
        value: https://dino-pad.pages.dev,https://dinopad.uncangrejocontrolamisfinanzas.tech
      - key: GEMINI_APIKEY        # opcional: explicaciones de las alertas
        sync: false
      - key: DATABASE_URL         # opcional: sin ella guarda en memoria
        sync: false
